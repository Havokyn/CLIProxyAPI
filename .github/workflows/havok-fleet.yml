name: Havok fleet tooling
on:
  push:
    paths: ['ops/havok-fleet/**', 'scripts/launchers/**', 'tests/fleet/**', 'docs/havok-fleet.md', '.github/workflows/havok-fleet.yml']
  pull_request:
    paths: ['ops/havok-fleet/**', 'scripts/launchers/**', 'tests/fleet/**', 'docs/havok-fleet.md', '.github/workflows/havok-fleet.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/fleet -v
      - run: python ops/havok-fleet/check-secret-safety.py
      - name: PowerShell parsing and dry runs
        shell: pwsh
        run: ./tests/fleet/test-powershell-launchers.ps1
      - name: POSIX syntax
        run: |
          for file in scripts/launchers/posix/*; do sh -n "$file"; done
      - run: git diff --check
